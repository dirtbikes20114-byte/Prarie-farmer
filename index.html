<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prairie Empire</title>

<style>

/* =========================================================
   GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #101827;
    color: #f5f7fa;
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* =========================================================
   HEADER
========================================================= */

header {
    height: 72px;
    padding: 12px 22px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background:
        linear-gradient(
            135deg,
            #123c28,
            #1f6b3b
        );

    border-bottom: 3px solid #65d88a;

    box-shadow:
        0 4px 20px #0008;

    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 25px;
    font-weight: 900;
}

.logo span {
    color: #7cf09b;
}

.stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.stat {
    background: #ffffff14;
    border: 1px solid #ffffff20;

    padding: 8px 13px;
    border-radius: 10px;

    font-weight: bold;
}

/* =========================================================
   LAYOUT
========================================================= */

.game {
    display: grid;
    grid-template-columns: 275px 1fr 330px;

    min-height:
        calc(100vh - 72px);
}

/* =========================================================
   SIDEBARS
========================================================= */

.sidebar {
    background: #151f30;
    padding: 16px;

    overflow-y: auto;

    border-right:
        1px solid #ffffff14;
}

.right {
    border-right: none;
    border-left:
        1px solid #ffffff14;
}

.section {
    margin-bottom: 18px;
}

.section-title {
    color: #7cf09b;
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 8px;
}

.card {
    background: #1c2738;

    border:
        1px solid #ffffff10;

    border-radius: 12px;

    padding: 12px;

    margin-bottom: 9px;
}

.card strong {
    color: #ffffff;
}

input,
select {
    width: 100%;

    padding: 11px;

    margin: 4px 0;

    border-radius: 8px;

    border:
        1px solid #40516b;

    background: #0f1724;

    color: white;
}

button {
    width: 100%;

    padding: 11px;

    margin: 4px 0;

    border: none;

    border-radius: 8px;

    background:
        linear-gradient(
            135deg,
            #36a85c,
            #5dd77e
        );

    color: #07150c;

    font-weight: 900;

    transition:
        transform .12s,
        filter .12s;
}

button:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
}

button.danger {
    background:
        linear-gradient(
            135deg,
            #e74c3c,
            #ff6b5b
        );

    color: white;
}

button.blue {
    background:
        linear-gradient(
            135deg,
            #2788df,
            #56b6ff
        );

    color: white;
}

button.gold {
    background:
        linear-gradient(
            135deg,
            #e0a52b,
            #ffd65b
        );
}

/* =========================================================
   FARM MAP (ENHANCED PHOTOGRAPHIC BACKDROP)
========================================================= */

.map {
    position: relative;

    overflow: hidden;

    min-height: 760px;

    background:
        linear-gradient(rgba(2, 6, 23, 0.3), rgba(2, 6, 23, 0.5)),
        url('https://unsplash.com');
    background-size: cover;
    background-position: center;
}

.sun {
    position: absolute;

    right: 8%;
    top: 50px;

    font-size: 72px;
    filter: drop-shadow(0 0 20px #fde047);
}

.cloud {
    position: absolute;

    font-size: 65px;

    opacity: .75;
}

.cloud1 {
    left: 12%;
    top: 55px;
}

.cloud2 {
    left: 52%;
    top: 105px;
}

.hills {
    position: absolute;

    left: 0;
    right: 0;

    top: 24%;

    height: 130px;

    background:
        radial-gradient(
            ellipse at 30% 100%,
            rgba(112, 156, 66, 0.4) 0 40%,
            transparent 41%
        ),
        radial-gradient(
            ellipse at 75% 100%,
            rgba(99, 142, 60, 0.4) 0 45%,
            transparent 46%
        );
}

.farmhouse {
    position: absolute;

    left: 5%;
    bottom: 23%;

    font-size: 80px;

    filter:
        drop-shadow(0 5px 4px #0007);
}

.farmyard {
    position: absolute;

    left: 3%;
    bottom: 6%;

    width: 245px;
    height: 135px;

    background: rgba(156, 113, 72, 0.85);
    backdrop-filter: blur(4px);

    border:
        6px solid #5b3d25;

    border-radius: 10px;
}

.barn {
    font-size: 65px;

    position: absolute;

    left: 78px;
    top: 28px;
}

.road {
    position: absolute;

    right: -10%;
    bottom: 10%;

    width: 75%;

    height: 65px;

    background: #b18b5e;

    transform:
        rotate(-8deg);

    opacity: .6;
}

/* =========================================================
   FIELDS (MASSIVE SYSTEM REBOOT)
========================================================= */

#fields {
    position: absolute;

    top: 32%;
    left: 28%;
    right: 4%;
    bottom: 4%;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;

    overflow-y: auto;
    padding: 10px;
}

.field {
    position: relative;

    min-height: 180px;

    border:
        4px solid #1e293b;

    border-radius: 16px;

    cursor: pointer;

    overflow: hidden;
    background-size: cover;
    background-position: center;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
}

.field:hover {
    transform: translateY(-4px) scale(1.02);

    box-shadow:
        0 12px 24px rgba(0, 0, 0, 0.6);
    border-color: #65d88a;
}

.empty {
    background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('https://unsplash.com');
}

.growing-wheat {
    background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.6)), url('https://unsplash.com');
}

.mature-wheat {
    background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.5)), url('https://unsplash.com');
}

.growing-corn {
    background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.6)), url('https://unsplash.com');
}

.mature-corn {
    background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.5)), url('https://unsplash.com');
}

.locked {
    background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('https://unsplash.com');
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
    cursor: default;
    border: 3px dashed rgba(255,255,255,0.15);
}

.locked:hover {
    transform: none;
    box-shadow: none;
    border-color: rgba(255,255,255,0.15);
}

.locked-title {
    font-size: 16px;
    font-weight: 700;
    color: #94a3b8;
    margin-bottom: 6px;
}

.price-tag {
    font-size: 22px;
    font-weight: 800;
    color: #ffd45a;
    margin-bottom: 12px;
}

.buy-acre-btn {
    width: auto;
    padding: 8px 18px;
    font-size: 13px;
    background: #ffd45a;
    color: #07150c;
}

.field-label {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));

    padding: 14px;

    text-align: left;

    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
}

.field-status-badge {
    background: #10b981;
    color: #042f1a;
    padding: 3px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
}

.field-status-badge.growing {
    background: #3b82f6;
    color: #ffffff;
}

/* =========================================================
   MARKETPLACE
========================================================= */

.market {
    position: fixed;

    inset: 0;

    background: #07101bcc;

    backdrop-filter:
        blur(7px);

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 500;
}

.market-window {
    width: 95%;
    max-width: 1050px;

    max-height: 90vh;

    overflow-y: auto;

    background: #151f30;

    border:
        2px solid #54d77c;

    border-radius: 18px;

    padding: 22px;

    box-shadow:
        0 20px 80px #000b;
}

.market-header {
    display: flex;

    justify-content: space-between;

    align-items: center;
}

.market-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(230px, 1fr)
        );

    gap: 12px;
}

.product {
    background: #1d293b;

    border:
        1px solid #ffffff12;

    border-radius: 13px;

    padding: 13px;

    transition:
        transform .12s,
        border-color .12s;
}

.product:hover {
    transform: translateY(-3px);

    border-color:
        #61db82;
}

.product-icon {
    font-size: 45px;
}

.product-brand {
    color: #6ee88e;

    font-size: 12px;

    font-weight: 900;

    text-transform: uppercase;
}

.product-name {
    font-size: 17px;

    font-weight: 900;

    margin: 3px 0;
}

.product-stat {
    color: #b8c5d6;

    font-size: 12px;

    margin: 3px 0;
}

};let gameState = JSON.parse(JSON.stringify(INITIAL_STATE));function updateUI() {document.getElementById('stat-cash').innerText = gameState.cash;document.getElementById('stat-day').innerText = gameState.day;let activeAcresCount = gameState.fields.filter(f => !f.locked).length;document.getElementById('stat-fields-count').innerText = activeAcresCount;document.getElementById('inv-seed-wheat').innerText = gameState.inventory['seed-wheat'];document.getElementById('inv-seed-corn').innerText = gameState.inventory['seed-corn'];document.getElementById('inv-crop-wheat').innerText = gameState.inventory['crop-wheat'];document.getElementById('inv-crop-corn').innerText = gameState.inventory['crop-corn'];document.getElementById('count-cattle').innerText = gameState.livestock.cattle;renderFields();renderPasture();}function renderFields() {const fieldsContainer = document.getElementById('fields');fieldsContainer.innerHTML = '';gameState.fields.forEach(field => {const fieldEl = document.createElement('div');if (field.locked) {fieldEl.className = field locked;fieldEl.innerHTML = <div class="locked-title">Acre Land Plot #${field.id}</div> <div class="price-tag">$${field.price}</div> <button class="buy-acre-btn" onclick="purchaseAcrePlot(${field.id}, ${field.price})">Purchase Acre</button>;} else {let stateClass = 'empty';let label = Acre #${field.id}: Fallow;let badgeHtml = <span class="field-status-badge">Fallow</span>;if (field.status === 'growing') {stateClass = growing-${field.crop};label = Acre #${field.id}: ${CROP_CONFIGS[field.crop].name};badgeHtml = <span class="field-status-badge growing">Growing ${field.progress}/${CROP_CONFIGS[field.crop].growDays}d</span>;} else if (field.status === 'mature') {stateClass = mature-${field.crop};label = Acre #${field.id}: ${CROP_CONFIGS[field.crop].name};badgeHtml = <span class="field-status-badge">Ready!</span>;}fieldEl.className = field ${stateClass};fieldEl.innerHTML = <div class="field-label"> <div><strong>${label}</strong></div> ${badgeHtml} </div>;fieldEl.onclick = () => handleFieldAction(field);}fieldsContainer.appendChild(fieldEl);});}function renderPasture() {const pasture = document.getElementById('pasture-animals');pasture.innerHTML = '';for(let i = 0; i < gameState.livestock.cattle; i++) {pasture.innerHTML += <div class="animal-token">🐂</div>;}}window.purchaseAcrePlot = function(id, cost) {if (gameState.cash >= cost) {gameState.cash -= cost;const targetField = gameState.fields.find(f => f.id === id);targetField.locked = false;targetField.status = 'empty';updateUI();} else {alert("Inadequate financial capital to purchase this acre plot property.");}};function handleFieldAction(field) {if (field.locked) return;const tool = document.getElementById('tool-selector').value;if (tool.startsWith('plant-')) {if (field.status !== 'empty') {alert("This acre must be empty to plant new crops!");return;}const cropType = tool.replace('plant-', '');const seedKey = seed-${cropType};if (gameState.inventory[seedKey] > 0) {gameState.inventory[seedKey]--;field.status = 'growing';field.crop = cropType;field.progress = 0;updateUI();} else {alert("Insufficient seed supplies!");}} else if (tool === 'inspect') {if (field.status === 'mature') {gameState.inventory[crop-${field.crop}]++;field.status = 'empty';field.crop = null;field.progress = 0;updateUI();} else {alert(Acre state: ${field.status.toUpperCase()}. Keep cultivating until harvest cycles ripen.);}}}document.getElementById('btn-next-day').onclick = () => {gameState.day++;gameState.fields.forEach(field => {if (!field.locked && field.status === 'growing') {field.progress++;if (field.progress >= CROP_CONFIGS[field.crop].growDays) {field.status = 'mature';}}});updateUI();};window.buyItem = function(item, cost) {if (gameState.cash >= cost) {gameState.cash -= cost;gameState.inventory[item]++;updateUI();} else {alert("Insufficient capital funding limits.");}};window.sellCrop = function(cropType, pricePerUnit) {const key = crop-${cropType};const amount = gameState.inventory[key];if (amount > 0) {const payout = amount * pricePerUnit;gameState.cash += payout;gameState.inventory[key] = 0;updateUI();alert(Successfully sold ${amount} units for $${payout}!);} else {alert("No stock reserves inside your silo.");}};document.getElementById('btn-feed-cattle').onclick = () => {if(gameState.inventory['crop-wheat'] >= 10) {gameState.inventory['crop-wheat'] -= 10;gameState.cash += 450;alert("Herd successfully fed! Market sale generated +$450 bonus.");updateUI();} else {alert("Requires minimum 10 Units of fully harvested Wheat.");}};/* =========================================================LOCAL STORAGE ENGINE SAVE/LOAD ROUTINES========================================================= */document.getElementById('btn-save').onclick = () => {localStorage.setItem('PrairieEmpire_MainSave', JSON.stringify(gameState));alert("Farm status successfully written to browser storage! 💾");};function loadGameData() {const rawData = localStorage.getItem('PrairieEmpire_MainSave');if (rawData) {gameState = JSON.parse(rawData);updateUI();return true;}return false;}document.getElementById('btn-load').onclick = () => {if (loadGameData()) {alert("Farm progress restored! 📂");} else {alert("No previous save data profile discovered on this machine.");}};// Open/Close Market Modalsconst marketModal = document.getElementById('market-modal');document.getElementById('btn-market').onclick = () => marketModal.style.display = 'flex';document.getElementById('btn-close-market').onclick = () => marketModal.style.display = 'none';// Auto Bootstrap Profileif (!loadGameData()) {updateUI();}
